<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlastellar — your night sky, mapped</title>
  <meta name="description" content="Place your astrophotos on the Milky Way, tick off the Messier and Caldwell catalogues, and see how much of the night sky you have captured. Open source, runs entirely in your browser.">
  <meta name="theme-color" content="#05060a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305060a'/%3E%3Cpath d='M16 5l2.2 8.8L27 16l-8.8 2.2L16 27l-2.2-8.8L5 16l8.8-2.2z' fill='%23ffc857'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <aside id="panel" aria-label="Atlastellar controls">
      <header class="brand">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M16 3l2.6 10.4L29 16l-10.4 2.6L16 29l-2.6-10.4L3 16l10.4-2.6z" fill="currentColor"/></svg>
        <div>
          <h1>Atlastellar</h1>
          <p>Your night sky, mapped.</p>
        </div>
      </header>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="photos" aria-selected="true">Photos <span class="count" id="count-photos"></span></button>
        <button role="tab" data-tab="catalog">Catalogue</button>
        <button role="tab" data-tab="stats">Stats</button>
        <button role="tab" data-tab="export">Export</button>
      </nav>
      <div class="tab-body" id="tab-body"></div>
      <footer class="privacy">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 10V7a5 5 0 0110 0v3M5.5 10h13a1 1 0 011 1v9a1 1 0 01-1 1h-13a1 1 0 01-1-1v-9a1 1 0 011-1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <div>Everything stays in this browser. Nothing is uploaded. <button class="link" id="clear-all">Clear all</button></div>
      </footer>
    </aside>

    <main id="stage">
      <canvas id="gl"></canvas>
      <canvas id="overlay" aria-label="Interactive map of the night sky"></canvas>
      <button id="hud" class="chip" title="Open your stats"></button>
      <div id="hint">Drag to look around · scroll or pinch to zoom · click an object</div>
      <div id="card" hidden></div>
      <div id="readout"></div>
      <div id="controls">
        <div class="group" id="layers"></div>
        <div class="group">
          <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
          <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
          <button id="show-all" title="Show the whole Milky Way">Show all</button>
        </div>
      </div>
      <div id="loading">Loading the sky…</div>
    </main>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
